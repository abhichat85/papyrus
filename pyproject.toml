[project]
name = "papyrus-engine"
version = "0.1.0"
description = "Papyrus — the universal document ingestion engine. Any file in, agent-ready Markdown out."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Einstein Labs" }]
keywords = ["markdown", "document", "ingestion", "rag", "llm", "pdf", "docx", "pptx", "xlsx"]

dependencies = [
    # ── Document parsing ───────────────────────────────────────
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "chardet>=5.2.0",
    "pyyaml>=6.0",
    # ── CLI ────────────────────────────────────────────────────
    "typer>=0.15.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
]
ocr = [
    "pytesseract>=0.3.13",
    "pillow>=11.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "httpx>=0.28.0",
]

[project.scripts]
papyrus = "papyrus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papyrus"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Fixture literals are documents; wrapping them would obscure what they are.
"tests/make_fixtures.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/2: the fixtures and docs deliberately contain non-ASCII text.
ignore = ["B008", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
